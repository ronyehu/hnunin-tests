<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="round"><rect width="512" height="512" rx="104"/></clipPath>
    <pattern id="stripes" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="46" height="46" fill="#0f1f24"/>
      <rect width="23" height="46" fill="#1b8f92"/>
    </pattern>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#1b8f92"/>
    <!-- striped side walls -->
    <rect x="0"   y="0" width="108" height="512" fill="url(#stripes)"/>
    <rect x="404" y="0" width="108" height="512" fill="url(#stripes)"/>
    <!-- energetic star-jump figure (echoes the photo) -->
    <g stroke="#f4c20d" stroke-width="34" stroke-linecap="round" fill="none">
      <path d="M256 214 L150 176"/>   <!-- left arm -->
      <path d="M256 214 L362 176"/>   <!-- right arm -->
      <path d="M256 206 L256 300"/>   <!-- torso -->
      <path d="M256 300 L172 404"/>   <!-- left leg -->
      <path d="M256 300 L340 404"/>   <!-- right leg -->
    </g>
    <circle cx="256" cy="150" r="40" fill="#f4c20d"/>
    <!-- little smiley on the chest, like the hoodie print -->
    <g fill="none" stroke="#1b8f92" stroke-width="7" stroke-linecap="round">
      <path d="M240 250 q16 16 32 0"/>
    </g>
    <circle cx="243" cy="238" r="4" fill="#1b8f92"/>
    <circle cx="269" cy="238" r="4" fill="#1b8f92"/>
  </g>
</svg>
